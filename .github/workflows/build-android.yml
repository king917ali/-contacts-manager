name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container: kivy/buildozer

    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee /tmp/build.log || {
            echo "## BUILD FAILED - last 200 lines:" >> $GITHUB_STEP_SUMMARY
            echo '<pre>' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '</pre>' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contacts-manager-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
