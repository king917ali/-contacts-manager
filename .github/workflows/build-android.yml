name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container: kivy/buildozer

    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contacts-manager-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
