name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          yes | sdkmanager --licenses || true
          yes | buildozer android debug || true

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 || true

      - name: Find APK
        id: find_apk
        run: |
          find . -name "*.apk" -type f > apk_files.txt
          cat apk_files.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: contacts-manager-apk
          path: |
            **/*.apk
            !.buildozer/**
          retention-days: 30
